name: Quantitative Trading Backtest

on:
  workflow_dispatch:
    inputs:
      output_format:
        description: 'Output format'
        required: false
        default: 'json'
        type: choice
        options:
        - json
        - detailed
  push:
    branches: [ main ]
    paths:
      - 'main_quantitative_system.py'
      - 'python/stock/**'
      - '.github/workflows/backtest.yml'
      - 'scripts/ci/**'

env:
  PYTHONPATH: ${{ github.workspace }}/python
  BACKTEST_OUTPUT_DIR: ${{ github.workspace }}/backtest_results
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # 自动可用的token
  # 如果需要自定义token，使用: GITHUB_TOKEN: ${{ secrets.CUSTOM_GITHUB_TOKEN }}

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.13.7'
        cache: 'pip'
        
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential
        
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        # 安装项目依赖（包含所有必要的包）
        cd python && pip install -e .
        cd ..
        
    - name: Create output directory
      run: mkdir -p ${{ env.BACKTEST_OUTPUT_DIR }}
        
    - name: Run main quantitative system
      run: |
        cd ${{ github.workspace }}
        python main_quantitative_system.py
      env:
        AKSHARE_USER_AGENT: 'GitHub-Actions-Backtest'
        
    - name: Collect backtest results
      run: |
        # 查找生成的结果文件
        find . -name "*backtest*.json" -o -name "*report*.json" -o -name "*results*.json" | head -10
        
        # 将找到的结果文件复制到输出目录
        find . -name "*backtest*.json" -exec cp {} ${{ env.BACKTEST_OUTPUT_DIR }}/ \;
        find . -name "*report*.json" -exec cp {} ${{ env.BACKTEST_OUTPUT_DIR }}/ \;
        find . -name "*results*.json" -exec cp {} ${{ env.BACKTEST_OUTPUT_DIR }}/ \;
        
        # 检查输出目录内容
        ls -la ${{ env.BACKTEST_OUTPUT_DIR }}/
        
    - name: Generate workflow summary
      run: |
        python scripts/ci/generate_workflow_summary.py \
          "${{ env.BACKTEST_OUTPUT_DIR }}" \
          "${{ github.run_id }}" \
          "${{ github.sha }}" \
          "${{ github.event_name }}" \
          "${{ github.event.inputs.output_format || 'json' }}"

    - name: Upload backtest artifacts
      uses: actions/upload-artifact@v4
      with:
        name: backtest-results-${{ github.run_id }}
        path: |
          ${{ env.BACKTEST_OUTPUT_DIR }}/
          data/backtest/
        retention-days: 30
        if-no-files-found: warn
        
    - name: Display key metrics in console
      run: python scripts/ci/display_key_metrics.py "${{ env.BACKTEST_OUTPUT_DIR }}"

    - name: Display backtest summary
      if: success()
      run: |
        echo ""
        echo "✅ 回测完成！"
        echo "� 完整结果查看方式："
        echo "  1. 👆 查看上方控制台输出的关键指标"
        echo "  2. 📦 下载 Artifacts 中的 backtest-results-${{ github.run_id }}"
        echo "  3. 📄 在 JSON 文件中查看完整分析报告"